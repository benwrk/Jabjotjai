# Proposes updates as pull requests, weekly: for the actions CI uses, which ci.yml pins to commit
# hashes, and for the Gradle dependencies, grouped into one pull request because some move
# together (kotlinx-serialization needs the Kotlin it was built with). Each commit subject takes the
# type and scope below, the form `.githooks/commit-msg` and CI accept (AGENTS.md, decision 0012).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      gradle:
        patterns:
          - "*"
