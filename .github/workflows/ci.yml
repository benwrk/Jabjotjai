# Builds, unit-tests and lints every push to master and every pull request, checks that both APKs
# are signed with the project's stable key (decision 0010), and keeps the debug APK as a
# downloadable artifact. It also checks that the commits each brings in have subjects in the form
# the release notes are generated from (decision 0012). A version tag (vMAJOR.MINOR.PATCH) on a
# commit already on master builds the same way, then attaches both APKs to a draft GitHub Release
# with generated notes, which the owner publishes. Decision 0011 records the choices made here.
#
# Signing needs four repository secrets, under Settings > Secrets and variables > Actions:
#   SIGNING_KEYSTORE        the keystore file, base64-encoded
#   SIGNING_STORE_PASSWORD  its password
#   SIGNING_KEY_ALIAS       the key's alias
#   SIGNING_KEY_PASSWORD    the key's password
name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

# The build runs third-party Gradle plugins and dependencies, so it gets a read-only token. It does
# hold the signing key, which it needs in order to sign. Only the release job, which runs none of
# the project's code, can write to the repository.
permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # The SHA-256 digest of the stable key's certificate, which every APK must carry. It changes
  # only when the key does.
  SIGNING_CERT_SHA256: 325a1e6688323ec147ea2eeb2dcd2c44d900b1e4301d2c996735863fcb5b4799

jobs:
  # The commit-msg hook checks each subject as it is written, but a hook can be skipped or not
  # installed, so the commits a push or pull request brings in are checked here as well. A tag
  # brings in no commits of its own.
  commits:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the commit subjects
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            range="$BASE..$HEAD_SHA"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$GITHUB_SHA"
          else
            echo "::warning::The commit before this push is not in the history, so only $GITHUB_SHA is checked."
            range="$GITHUB_SHA^!"
          fi
          sh scripts/commits.sh check "$range"

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Each action is pinned to the commit its release tag named when this was written, so a
      # moved tag cannot change what runs (docs.github.com/en/actions/reference/security/secure-use,
      # read 2026-11-27). The comment names that tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every branch, so that a tag run can check its commit against master.
          fetch-depth: 0
          persist-credentials: false

      # The trigger's filters match a branch or a tag, never a tag on a branch
      # (docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax, read
      # 2026-11-27), so the branch is checked here.
      - name: Check the tag is a version on master
        if: github.ref_type == 'tag'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a version tag of the form vMAJOR.MINOR.PATCH."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::$GITHUB_REF_NAME is on a commit that is not on master. Push master, then re-run this job."
            exit 1
          fi

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          # The major version of the project JDK set in .idea/misc.xml, Android Studio's JBR 25.
          java-version: '25'

      # Checks gradle-wrapper.jar against Gradle's published checksums, and caches Gradle's
      # downloads. Only master runs write the cache, and every run can read master's. The default
      # cache provider is a commercial library under its own licence terms; the basic one is
      # MIT-licensed (setup-gradle docs at v6.4.1, read 2026-11-27).
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Write the keystore where the build reads it
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [[ -z "$SIGNING_KEYSTORE" ]]; then
            echo "::error::The SIGNING_KEYSTORE secret is not available to this run, so its APKs cannot be signed."
            exit 1
          fi
          base64 --decode <<< "$SIGNING_KEYSTORE" > "$RUNNER_TEMP/signing.keystore"

      # Assembles the debug and release APKs, runs the unit tests and runs lint. Gradle reads
      # ORG_GRADLE_PROJECT_<name> as the property <name> (observed 2026-11-27, Gradle 9.9.2), and
      # the build stops if any of the four is missing.
      - name: Build, unit-test and lint
        env:
          ORG_GRADLE_PROJECT_jabjotjaiSigningStoreFile: ${{ runner.temp }}/signing.keystore
          ORG_GRADLE_PROJECT_jabjotjaiSigningStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_jabjotjaiSigningKeyAlias: ${{ secrets.SIGNING_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_jabjotjaiSigningKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew build

      # The notices must list exactly what the release build includes (decision 0015), so a
      # dependency change that is not reflected in them fails here.
      - name: Check the third-party notices are current
        env:
          ORG_GRADLE_PROJECT_jabjotjaiSigningStoreFile: ${{ runner.temp }}/signing.keystore
          ORG_GRADLE_PROJECT_jabjotjaiSigningStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_jabjotjaiSigningKeyAlias: ${{ secrets.SIGNING_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_jabjotjaiSigningKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          sh scripts/third-party-notices.sh > "$RUNNER_TEMP/THIRD_PARTY_NOTICES.md"
          if ! diff -u THIRD_PARTY_NOTICES.md "$RUNNER_TEMP/THIRD_PARTY_NOTICES.md"; then
            echo "::error::THIRD_PARTY_NOTICES.md does not match the build's dependencies. Run: sh scripts/third-party-notices.sh > THIRD_PARTY_NOTICES.md"
            exit 1
          fi

      - name: Keep the reports of a failed build
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore

      # Reads the version and the signing certificates from the APKs themselves, since they are what
      # gets installed. A tag run also checks the version against the tag and writes the release
      # notes.
      - name: Check the APKs and name them
        id: apks
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          version_of() {
            "$tools/aapt2" dump badging "$1" | sed -n "s/^package: .* versionName='\([^']*\)'.*/\1/p"
          }
          # Each distinct certificate the APK's signers use. The wording differs between build-tools
          # versions: 36.0.0 prints "Signer #1 certificate SHA-256 digest: ..." and 37.0.0 prints
          # "V2 Signer: certificate SHA-256 digest: ..." (both seen 2026-11-27), so the full output
          # also goes to the log.
          signers_of() {
            local certs
            certs=$("$tools/apksigner" verify --print-certs "$1")
            printf 'apksigner verify --print-certs %s:\n%s\n' "$1" "$certs" >&2
            sed -n 's/^.*Signer.* certificate SHA-256 digest: //p' <<< "$certs" | sort -u
          }
          debug=app/build/outputs/apk/debug/app-debug.apk
          release=app/build/outputs/apk/release/app-release.apk

          version=$(version_of "$debug")
          if [[ -z "$version" || "$(version_of "$release")" != "$version" ]]; then
            echo "::error::Could not read one versionName from both APKs."
            exit 1
          fi
          for apk in "$debug" "$release"; do
            signers=$(signers_of "$apk")
            if [[ "$signers" != "$SIGNING_CERT_SHA256" ]]; then
              echo "::error::$apk is signed by [${signers//$'\n'/, }], not by the stable key alone ($SIGNING_CERT_SHA256)."
              exit 1
            fi
          done

          mkdir dist
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            apk="dist/jabjotjai-$version-$(git rev-parse --short=12 HEAD)-debug.apk"
            cp "$debug" "$apk"
            echo "debug=$apk" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The APKs have versionName $version, but the tag is $GITHUB_REF_NAME. Set appVersion in app/build.gradle.kts to ${GITHUB_REF_NAME#v}."
            exit 1
          fi
          cp "$release" "dist/jabjotjai-$version.apk"
          cp "$debug" "dist/jabjotjai-$version-debug.apk"
          cp THIRD_PARTY_NOTICES.md LICENSE dist/
          # The changes since the previous version tag, generated from the commit subjects.
          sh scripts/commits.sh notes "$GITHUB_REF_NAME" > dist/notes.md
          cat >> dist/notes.md <<EOF

          ---

          Built from \`$(git rev-parse HEAD)\` by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID.

          Both APKs are signed with the project's key, whose certificate has the SHA-256 digest \`$SIGNING_CERT_SHA256\`.

          - \`jabjotjai-$version.apk\` is the release build, optimised with R8.
          - \`jabjotjai-$version-debug.apk\` is the debug build of the same commit.
          - \`LICENSE\` is the licence they are used under, and \`THIRD_PARTY_NOTICES.md\` lists the third-party software they include, with its licences.
          EOF

      - name: Keep the debug APK
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.apks.outputs.debug }}
          # Uploads the APK itself rather than a zip of it, named after the file.
          archive: false
          if-no-files-found: error

      - name: Hand the release files to the release job
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Creating a release needs push access (docs.github.com/en/rest/releases/releases, read
      # 2026-11-27).
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      # A draft, so that the owner reads it and publishes it by hand. Before 1.0.0 the app is not
      # yet stable (decision 0005), so those releases are marked as prereleases.
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=()
          if [[ "$version" == 0.* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/LICENSE dist/THIRD_PARTY_NOTICES.md --draft --verify-tag \
            --title "Jabjotjai $version" --notes-file dist/notes.md "${prerelease[@]}"
